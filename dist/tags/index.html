<!doctype html>
<html lang="zh-CN" data-page="tags" class="sidebar-collapsed">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="light dark">
    <meta name="description" content="TecntOvO 个人站点的研究标签。">
    <link rel="canonical" href="https://tecntovo.github.io/tags/">
    <link rel="icon" type="image/svg+xml" href="/assets/favicon.svg">
    <link rel="stylesheet" href="/assets/site.css">
    <title>标签 · TecntOvO</title>
    <script>
      (() => {
        const root = document.documentElement;
        let mode = "system";
        try { mode = localStorage.getItem("tecntovo-theme") || "system"; } catch {}
        root.dataset.themeMode = mode;
        root.dataset.theme = mode === "system" ? (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light") : mode;
      })();
    </script>
  </head>
  <body>
    <aside id="sidebar" class="sidebar" aria-label="侧栏"></aside>
    <div id="sidebar-scrim" class="sidebar-scrim" aria-hidden="true"></div>
    <div class="content-shell">
      <header id="topbar" class="topbar"></header>
      <main class="page-content">
        <header class="page-header">
          <p class="eyebrow">主题标签</p>
          <h1>标签</h1>
          <p class="lede">用于快速定位研究方向、方法与工具。</p>
        </header>

        <section class="tag-panel" aria-label="标签列表">
          <div class="tag-cloud">
            <span class="tag-chip">2D Gaussian Splatting</span>
            <span class="tag-chip">VEM</span>
            <span class="tag-chip">Super-Resolution</span>
            <span class="tag-chip">Electron Microscopy</span>
            <span class="tag-chip">Restormer</span>
            <span class="tag-chip">PyTorch</span>
            <span class="tag-chip">Attention</span>
            <span class="tag-chip">Computer Vision</span>
            <span class="tag-chip">Deep Learning</span>
            <span class="tag-chip">Reproducibility</span>
          </div>
        </section>
      </main>
      <footer class="footer">© 2026 TecntOvO · 研究笔记 · 项目记录 · 技术实践</footer>
    </div>
    <script src="/assets/site-config.js"></script>
    <script src="/assets/site.js"></script>
  </body>
</html>
