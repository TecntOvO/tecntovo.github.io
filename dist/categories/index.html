<!doctype html>
<html lang="zh-CN" data-page="categories" class="sidebar-collapsed">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="light dark">
    <meta name="description" content="TecntOvO 的 GitHub 公开仓库与项目。">
    <link rel="canonical" href="https://tecntovo.github.io/categories/">
    <link rel="icon" type="image/svg+xml" href="/assets/favicon.svg">
    <link rel="stylesheet" href="/assets/site.css">
    <title>仓库 · TecntOvO</title>
    <script>
      (() => {
        const root = document.documentElement;
        let mode = "system";
        try { mode = localStorage.getItem("tecntovo-theme") || "system"; } catch {}
        root.dataset.themeMode = mode;
        root.dataset.theme = mode === "system" ? (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light") : mode;
      })();
    </script>
  </head>
  <body>
    <aside id="sidebar" class="sidebar" aria-label="侧栏"></aside>
    <div id="sidebar-scrim" class="sidebar-scrim" aria-hidden="true"></div>
    <div class="content-shell">
      <header id="topbar" class="topbar"></header>
      <main class="page-content">
        <header class="page-header">
          <p class="eyebrow">GitHub Projects</p>
          <h1>仓库</h1>
          <p class="lede">从 GitHub 同步的公开项目与代码仓库。</p>
        </header>

        <div id="repository-status" class="repo-status" role="status">正在从 GitHub 获取公开仓库…</div>
        <div id="repository-grid" class="repo-grid" aria-live="polite" aria-busy="true">
          <div class="repo-skeleton" aria-hidden="true"></div>
          <div class="repo-skeleton" aria-hidden="true"></div>
          <div class="repo-skeleton" aria-hidden="true"></div>
          <div class="repo-skeleton" aria-hidden="true"></div>
          <div class="repo-skeleton" aria-hidden="true"></div>
          <div class="repo-skeleton" aria-hidden="true"></div>
        </div>
      </main>
      <footer class="footer">© 2026 TecntOvO · 研究笔记 · 项目记录 · 技术实践</footer>
    </div>
    <script src="/assets/site-config.js"></script>
    <script src="/assets/site.js"></script>
    <script src="/assets/repositories.js"></script>
  </body>
</html>
